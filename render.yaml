# Blueprint do Render — cria o serviço web SIGCOI (Express + Vite build).
# A URL pública nasce no painel do Render vinculada ao repositório comunitário.
#
# O banco de dados PostgreSQL de produção é gerenciado no Neon (console.neon.tech)
# ou no servidor da própria universidade. O Postgres gratuito do Neon não tem prazo
# de expiração e inclui backups automáticos com point-in-time recovery.
# A ligação é feita exclusivamente pela variável DATABASE_URL.

services:
  - type: web
    name: sigcoi
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Connection string "pooled" do PostgreSQL (Neon ou servidor da faculdade).
      - key: DATABASE_URL
        sync: false
      # Segredo para assinatura criptográfica de cookies de sessão httpOnly:
      - key: SESSION_SECRET
        generateValue: true
      # Opcional — Gemini API Key para condução por voz e assistente IA:
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      # Identidade Institucional da Universidade Parceira:
      - key: VITE_INSTITUTION_NAME
        sync: false
      - key: VITE_INSTITUTION_ACRONYM
        sync: false
      - key: VITE_COLLECTION_PREFIX
        value: COI
      - key: VITE_CURATOR_CONTACT_EMAIL
        sync: false
      - key: VITE_DEFAULT_LANGUAGE
        value: pt-BR
      - key: VITE_SYSTEM_NAME
        value: SIGCOI
